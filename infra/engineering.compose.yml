services:
  engineering:
    build:
      context: ./worker
      dockerfile: engineering.Dockerfile
    restart: unless-stopped
    env_file: engineering.env
    environment:
      SWITCH_URL: http://switch:8000
      ENGINEERING_STATE_DIR: /opt/r2r/engineering-state
      AWS_EC2_METADATA_DISABLED: "false"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # Same absolute path in host and orchestrator for child container mounts.
      - /opt/r2r/engineering-state:/opt/r2r/engineering-state
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=64m
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    mem_limit: 512m
    pids_limit: 96
