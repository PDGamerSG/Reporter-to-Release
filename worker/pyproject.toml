[project]
name = "r2r-switch-worker"
version = "1.0.0"
description = "Persistent Switch room connections and reliable delivery for Reporter-to-Release"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28,<1",
    "websockets>=15,<17",
    "python-dotenv>=1,<2",
    "boto3>=1.40,<2",
]

[project.optional-dependencies]
test = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2", "ruff>=0.14"]

[project.scripts]
r2r-worker = "r2r_worker.main:main"
r2r-engineering = "r2r_engineering.runtime:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/r2r_worker", "src/r2r_engineering", "src/switchkit"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
