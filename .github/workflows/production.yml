name: Record verified production

on:
  workflow_run:
    workflows: [Verify application]
    branches: [main]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: production-recorder-main
  cancel-in-progress: true

jobs:
  record:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Check out the verified revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Verify Vercel production and publish GitHub evidence
        run: node --import tsx scripts/production-release.ts
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
